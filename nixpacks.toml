# Railway/Nixpacks config — build and run ONLY the Python backend in backend/.
#
# Without this, Nixpacks sees the root package.json and auto-detects a Node
# project, then tries to build the React frontend (which is hosted elsewhere)
# and the deploy fails. Forcing the `python` provider makes it ignore the
# frontend entirely and install/run the FastAPI app instead.

providers = ['python']

[phases.setup]
nixPkgs = ['python311']

[phases.install]
cmds = ['pip install -r backend/requirements.txt']

[start]
cmd = 'cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT'
